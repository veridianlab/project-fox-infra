name: "CI: Tag commit"

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "target ref to tag"
        type: string
        required: true
  workflow_call:
    inputs:
      target_ref:
        description: "target ref to tag"
        type: string
        required: true
    outputs:
      tag:
        description: "the created tag"
        value: ${{ jobs.tag.outputs.tag }}

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
      - name: Create Release Tag
        uses: mathieudutour/github-tag-action@v6.2
        id: tag_version
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Echo tag
        run: echo ${{ steps.tag_version.outputs.new_tag }}
